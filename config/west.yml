# ZMK comes from the MoErgo fork (Zephyr 3.5, the ZMK v0.3 base). The urob modules are
# pinned to their v0.3 releases, which match that base: their main branches target Zephyr 4.1
# and do not build against this fork.
#
# Every project is pinned to a commit so two builds of the same config compile identical
# sources; tags and branches are noted in comments. When bumping zmk:
# - update the build workflow's pinned ref in .github/workflows/build.yml to the same commit;
# - re-pin zephyr to the commit of the branch that zmk's app/west.yml names.
manifest:
  remotes:
    - name: moergo-sc
      url-base: https://github.com/moergo-sc
    - name: urob
      url-base: https://github.com/urob
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
  projects:
    - name: zmk
      remote: moergo-sc
      revision: 4b2f3b9b718a4508e87111cdec24cda16f3c2726 # main (2026-08-21)
      import: app/west.yml
    # Overrides zmk's zephyr entry, which tracks a branch. The import filter mirrors zmk's.
    - name: zephyr
      remote: zmkfirmware
      revision: dacab4875df72109b96cc8977547a0dc04875bcd # v3.5.0+zmk-fixes
      clone-depth: 1
      import:
        name-blocklist:
          - ci-tools
          - hal_altera
          - hal_cypress
          - hal_infineon
          - hal_microchip
          - hal_nxp
          - hal_openisa
          - hal_silabs
          - hal_xtensa
          - hal_st
          - hal_ti
          - loramac-node
          - mcuboot
          - mcumgr
          - net-tools
          - openthread
          - edtt
          - trusted-firmware-m
    - name: zmk-helpers
      remote: urob
      revision: b1548efd28d2cc64b9506654e6883695c258190f # v0.3.0
    - name: zmk-auto-layer
      remote: urob
      revision: b31aa0a357343535a56d535edd0c2ad64d3d7230 # v0.3.0
    - name: zmk-unicode
      remote: urob
      revision: 3e8ca744e5c3b6f430b3713f3e45b806ce89be7b # v0.3 (2025-12-04)
  self:
    path: config
