name: Build ZMK firmware

on:
  workflow_dispatch:
  push:
    paths:
      - config/**
      - build.yaml
      - .github/workflows/**
  pull_request:
    paths:
      - config/**
      - build.yaml
      - .github/workflows/**

permissions:
  contents: read

jobs:
  build:
    # Keep this ref on the same commit as the zmk revision in config/west.yml.
    uses: moergo-sc/zmk/.github/workflows/build-user-config.yml@ce69e85f585c724142aae37ddf8a7e019ff19e93
